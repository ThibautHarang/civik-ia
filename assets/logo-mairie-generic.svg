<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Bâtiment municipal stylisé — générique pour démo Villeneuve-les-Ormes (commune fictive) -->
  <rect width="100" height="100" rx="12" fill="#fdfbf5"/>
  <!-- Colonnes + fronton façade mairie -->
  <polygon points="50,20 22,40 78,40" fill="#1A3518"/>
  <rect x="22" y="40" width="56" height="42" fill="#2a5028" stroke="#1A3518" stroke-width="1"/>
  <rect x="30" y="46" width="4" height="30" fill="#fdfbf5"/>
  <rect x="42" y="46" width="4" height="30" fill="#fdfbf5"/>
  <rect x="54" y="46" width="4" height="30" fill="#fdfbf5"/>
  <rect x="66" y="46" width="4" height="30" fill="#fdfbf5"/>
  <!-- Escalier -->
  <rect x="18" y="82" width="64" height="3" fill="#1A3518"/>
  <!-- Petit drapeau -->
  <line x1="50" y1="20" x2="50" y2="10" stroke="#1A3518" stroke-width="1.5"/>
  <rect x="50" y="10" width="6" height="4" fill="#e74c3c"/>
</svg>
