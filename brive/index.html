<!-- Redirection vers la démo vitrine de l'app (JS uniquement : les robots d'aperçu
     de lien — WhatsApp, iMessage… — ne suivent PAS la redirection et lisent donc
     bien les balises Open Graph de CETTE page, pas celles de /app/). -->
<style>
  :root{ --bg:#f7f4ed; --blue:#000091; --teal:#2EC4B6; --ink:#1E1E1E; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px;text-align:center;
  }
  .card{max-width:420px;width:100%}
  .mark{
    width:64px;height:64px;border-radius:18px;margin:0 auto 22px;
    background:linear-gradient(135deg,var(--blue),#007bff);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 30px rgba(0,0,145,.22);
  }
  .mark span{color:#fff;font-weight:800;font-size:30px;font-family:Georgia,"Times New Roman",serif;line-height:1}
  h1{font-size:21px;margin:0 0 6px;letter-spacing:-.4px;color:var(--blue)}
  .sub{font-size:15px;color:#5b5b5b;margin:0 0 26px}
  .sub strong{color:var(--ink)}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(0,0,145,.15);border-top-color:var(--teal);margin:0 auto 20px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none;border-top-color:var(--blue)}}
  a.cta{display:inline-block;margin-top:4px;color:var(--teal);text-decoration:none;font-weight:600;font-size:14px}
  a.cta:hover{text-decoration:underline}
  .foot{margin-top:30px;font-size:12px;color:#9a958c}
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true"><span>M</span></div>
    <div class="spinner" role="status" aria-label="Chargement"></div>
    <h1>Civik-ia</h1>
    <p class="sub">Ouverture de la démonstration<br><strong>Brive-la-Gaillarde</strong>…</p>
    <a class="cta" href="/app/?demo=1&amp;slug=demo-brive-la-gaillarde">Accéder à la démo &rarr;</a>
    <p class="foot">Plateforme d'Intelligence Citoyenne<br>
      <span style="font-size:11px;color:#b3aea4">Photo : Benjamin Smith — Wikimedia Commons · CC BY-SA 4.0 (recadrée)</span>
    </p>
  </main>
  <script>
    // Redirection immédiate (le meta refresh sert de filet de sécurité)
    window.location.replace('/app/?demo=1&slug=demo-brive-la-gaillarde');
  </script>
</body>
</html>
