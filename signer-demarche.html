<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Signer votre démarche : Civik-ia</title>
  <meta name="description" content="Signez électroniquement votre démarche citoyenne. Signature eIDAS conforme, valeur juridique.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#000091">
  <link rel="icon" href="/assets/logo-civik-ia-seul.svg" type="image/svg+xml">
  <style>
    :root {
      --p: #000091; --p-dark: #00006e; --p-soft: rgba(0,0,145,0.08);
      --teal: #2EC4B6; --teal-dark: #0a8b82; --teal-soft: rgba(46,196,182,0.12);
      --ink: #1E1E1E; --ink-soft: #4a4a4a; --ink-light: #5b6470;
      --cream: #f7f4ed; --line: #e8e2d4; --white: #fff;
      --red: #ef4444; --green: #10b981; --orange: #f59e0b;
      --shadow: 0 4px 24px rgba(0,0,145,0.08);
    }
    *,*::before,*::after { box-sizing: border-box; }
    html,body { margin:0; padding:0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: var(--cream); color: var(--ink); line-height: 1.55; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }
    .sr-only:focus { position:static;width:auto;height:auto;margin:0;clip:auto;white-space:normal;display:inline-block;padding:8px 14px;background:var(--p);color:#fff;border-radius:0 0 8px 0; }
    .wrap { max-width: 680px; margin: 0 auto; padding: 24px 18px 80px; }

    .header { text-align: center; margin-bottom: 24px; }
    .logo-pill { display: inline-block; padding: 6px 14px; background: var(--p-soft); color: var(--p); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; border-radius: 9999px; margin-bottom: 12px; }
    h1 { font-size: clamp(22px, 4.5vw, 28px); font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; line-height: 1.2; }
    .sub { font-size: 14px; color: var(--ink-soft); margin: 0; }

    .card { background: var(--white); border-radius: 16px; padding: 28px; box-shadow: var(--shadow); margin-bottom: 16px; }
    h2 { font-size: 18px; font-weight: 800; margin: 0 0 12px; color: var(--p); }

    .ticket-pill { display: inline-block; padding: 6px 14px; background: var(--p); color: #fff; font-family: 'SF Mono','Menlo','Courier New',monospace; font-size: 13px; font-weight: 700; border-radius: 8px; letter-spacing: 0.04em; margin-bottom: 14px; }

    .row { display: flex; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .row:last-child { border-bottom: none; }
    .row .label { color: var(--ink-light); width: 140px; flex-shrink: 0; font-size: 13px; }
    .row .value { flex: 1; color: var(--ink); font-weight: 500; }
    .row .value.muted { color: var(--ink-light); font-style: italic; }

    label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; color: var(--ink); }
    .field-hint { font-size: 12px; color: var(--ink-light); margin: -2px 0 6px; }
    input[type=text], textarea { width: 100%; font-family: inherit; font-size: 15px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 10px; background: var(--white); color: var(--ink); transition: border-color 0.15s; }
    input:focus, textarea:focus { outline: none; border-color: var(--p); box-shadow: 0 0 0 3px var(--p-soft); }

    .consent-box {
      background: var(--cream); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
      font-size: 13px; color: var(--ink-soft); line-height: 1.55; margin: 12px 0;
    }
    .consent-box strong { color: var(--ink); }
    .consent-check { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0; cursor: pointer; }
    .consent-check input { margin-top: 4px; flex-shrink: 0; width: 18px; height: 18px; }
    .consent-check span { font-size: 14px; line-height: 1.5; }

    .eidas-banner {
      background: linear-gradient(135deg, var(--teal-soft) 0%, var(--p-soft) 100%);
      border-left: 4px solid var(--teal); padding: 14px 18px; border-radius: 0 10px 10px 0;
      font-size: 13px; line-height: 1.55; margin: 14px 0;
    }

    .actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-primary { flex: 1; background: var(--p); color: #fff; border: 0; border-radius: 12px; padding: 14px 22px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background 0.15s; }
    .btn-primary:hover { background: var(--p-dark); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary.large { padding: 18px; font-size: 16px; }

    .loader { text-align: center; padding: 40px 20px; color: var(--ink-light); }
    .loader-spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--p); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-banner { background: #fee2e2; color: #991b1b; padding: 12px 16px; border-radius: 8px; font-size: 14px; margin: 12px 0; border-left: 4px solid var(--red); }

    .success-card {
      background: linear-gradient(135deg, var(--teal-soft) 0%, var(--p-soft) 100%);
      border-radius: 16px; padding: 32px 28px; text-align: center;
    }
    .success-icon { font-size: 64px; margin-bottom: 12px; }
    .success-card h2 { font-size: 22px; margin: 0 0 12px; color: var(--p); }
    .success-card p { color: var(--ink); margin: 8px 0; }
    .suivi-link { display: inline-block; padding: 14px 24px; background: var(--teal); color: #fff !important; border-radius: 9999px; text-decoration: none; font-weight: 700; font-size: 14px; margin-top: 16px; }

    .payload-detail { background: var(--cream); border-radius: 10px; padding: 14px 16px; margin: 10px 0; font-size: 13px; line-height: 1.7; }
    .payload-detail strong { color: var(--p); }

    .footer { text-align: center; margin-top: 32px; color: var(--ink-light); font-size: 12px; line-height: 1.6; }
    .footer a { color: var(--p); text-decoration: none; font-weight: 600; }

    @media (max-width: 480px) {
      .wrap { padding: 18px 12px 60px; }
      .card { padding: 20px; }
      .row { flex-direction: column; gap: 2px; }
      .row .label { width: auto; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
<a href="#main" class="sr-only">Aller au contenu</a>
<div class="wrap" id="main">

  <div class="header">
    <span class="logo-pill">Civik-ia · Signature eIDAS</span>
    <h1>Signer votre démarche</h1>
    <p class="sub">Signature électronique conforme au Règlement UE n°910/2014</p>
  </div>

  <div id="content" aria-live="polite" aria-busy="true">
    <div class="card"><div class="loader">
      <div class="loader-spinner" aria-hidden="true"></div>
      <div>Chargement de votre démarche…</div>
    </div></div>
  </div>

  <div class="footer">
    Cette page est personnelle et confidentielle.<br>
    <a href="https://civik-ia.fr">civik-ia.fr</a> · Plateforme d'Intelligence Citoyenne
  </div>
</div>

<script>
(function () {
  function getToken() {
    var path = window.location.pathname;
    var match = path.match(/\/signer-demarche\/([^\/?#]+)/);
    if (match) return decodeURIComponent(match[1]);
    var qs = new URLSearchParams(window.location.search);
    return qs.get('token');
  }

  var API_BASE = 'https://api.civik-ia.fr';
  var TOKEN = getToken();
  var state = { demarche: null, error: null, submitting: false, fullName: '', consent: false, result: null };

  function escapeHtml(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, function (c) { return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]; }); }

  function fmtDate(epoch) {
    if (!epoch) return '-';
    var d = new Date(epoch * 1000);
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' }) + ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  function load() {
    if (!TOKEN) {
      state.error = 'Aucun token de signature trouvé dans l\'URL.';
      render(); return;
    }
    // On utilise l'endpoint de suivi public pour récupérer les infos
    fetch(API_BASE + '/api/demarches/suivi/' + encodeURIComponent(TOKEN))
      .then(function (r) {
        if (r.status === 404) throw new Error('Ce lien de signature n\'est plus valide.');
        if (!r.ok) throw new Error('Erreur réseau (HTTP ' + r.status + ').');
        return r.json();
      })
      .then(function (d) { state.demarche = d; render(); })
      .catch(function (err) { state.error = err.message; render(); });
  }

  function humanizePayload(payload) {
    if (!payload || Object.keys(payload).length === 0) return '';
    var html = '<div class="payload-detail">';
    Object.keys(payload).forEach(function (k) {
      var label = k.replace(/_/g, ' ');
      label = label.charAt(0).toUpperCase() + label.slice(1);
      var v = payload[k];
      var s = (v === null || v === undefined || v === '') ? '-' :
              (typeof v === 'boolean') ? (v ? 'Oui' : 'Non') :
              (Array.isArray(v)) ? v.join(', ') : String(v);
      html += '<div><strong>' + escapeHtml(label) + ' :</strong> ' + escapeHtml(s) + '</div>';
    });
    html += '</div>';
    return html;
  }

  function submit() {
    if (state.submitting || !state.demarche) return;
    if (state.fullName.trim().length < 2) { state.error = 'Veuillez saisir votre nom complet.'; render(); return; }
    if (!state.consent) { state.error = 'Vous devez accepter les conditions pour signer.'; render(); return; }

    state.submitting = true; state.error = null; render();

    fetch(API_BASE + '/api/demarches/' + encodeURIComponent(state.demarche.ticket_id) + '/sign', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        signature_full_name: state.fullName.trim(),
        consent_text: "J'atteste avoir pris connaissance des informations ci-dessus, les certifie exactes, et accepte de signer électroniquement cette démarche (RGPD + Règlement UE 910/2014 eIDAS art. 25.1).",
        suivi_token: TOKEN
      })
    }).then(function (r) {
      return r.json().then(function (data) {
        if (!r.ok) {
          if (r.status === 409) throw new Error(data.detail || 'Démarche déjà signée.');
          throw new Error(data.detail || 'Erreur lors de la signature.');
        }
        return data;
      });
    }).then(function (data) {
      state.result = data; state.submitting = false; render(); window.scrollTo(0, 0);
    }).catch(function (err) {
      state.error = err.message; state.submitting = false; render();
    });
  }

  function render() {
    var c = document.getElementById('content');
    c.setAttribute('aria-busy', 'false');
    var html = '';
    if (state.error && !state.demarche) {
      c.innerHTML = '<div class="card"><div class="error-banner" role="alert">' + escapeHtml(state.error) + '</div></div>';
      return;
    }
    if (!state.demarche) { return; }

    if (state.result) {
      html += '<div class="success-card" role="status" aria-labelledby="signed-title">';
      html += '<div class="success-icon" aria-hidden="true">✅</div>';
      html += '<h2 id="signed-title">Démarche signée et transmise</h2>';
      html += '<p><strong>' + escapeHtml(state.result.ticket_id) + '</strong></p>';
      html += '<p>' + escapeHtml(state.result.message) + '</p>';
      html += '<p style="font-size:13px;color:var(--ink-light);margin-top:14px;">Vous recevrez par email votre PDF signé et un lien de suivi.</p>';
      html += '<a href="' + escapeHtml(state.result.suivi_url) + '" class="suivi-link">Suivre ma démarche →</a>';
      html += '</div>';
      c.innerHTML = html;
      return;
    }

    var d = state.demarche;
    var alreadySigned = !!d.signed_at;

    if (alreadySigned) {
      html += '<div class="card" role="status" aria-labelledby="already-title">';
      html += '<div class="ticket-pill">' + escapeHtml(d.ticket_id) + '</div>';
      html += '<h2 id="already-title">Démarche déjà signée</h2>';
      html += '<p style="color:var(--ink-soft);margin:0 0 14px;">Cette démarche a été signée le <strong>' + fmtDate(d.signed_at) + '</strong> par <strong>' + escapeHtml(d.signature_full_name || '-') + '</strong>.</p>';
      if (d.pdf_url) html += '<p><a href="' + escapeHtml(d.pdf_url) + '" target="_blank" rel="noopener" class="suivi-link" aria-label="Télécharger le PDF signé (nouvelle fenêtre)">Télécharger le PDF signé →</a></p>';
      html += '</div>';
      c.innerHTML = html;
      return;
    }

    if (state.error) html += '<div class="error-banner" role="alert">' + escapeHtml(state.error) + '</div>';

    html += '<div class="card" role="group" aria-labelledby="recap-title">';
    html += '<div class="ticket-pill">' + escapeHtml(d.ticket_id) + '</div>';
    html += '<h2 id="recap-title">Récapitulatif de votre demande</h2>';
    html += '<div class="row"><div class="label">Mairie</div><div class="value">' + escapeHtml(d.commune.name) + '</div></div>';
    html += '<div class="row"><div class="label">Type de démarche</div><div class="value">' + escapeHtml(d.type_label) + '</div></div>';
    html += '<div class="row"><div class="label">Date de demande</div><div class="value">' + fmtDate(d.created_at) + '</div></div>';
    html += '<div class="row"><div class="label">Pour qui</div><div class="value">' + ({ moi: 'Moi-même', proche: 'Un proche', tiers: 'Un tiers' }[d.pour_qui] || d.pour_qui) + '</div></div>';
    if (Object.keys(d.payload || {}).length > 0) {
      html += '<h2 style="margin-top:18px;font-size:15px;">Détails saisis</h2>';
      html += humanizePayload(d.payload);
    }
    html += '</div>';

    html += '<div class="card" role="group" aria-labelledby="sign-title">';
    html += '<h2 id="sign-title">Signature électronique</h2>';

    html += '<div class="eidas-banner">';
    html += '<strong>Signature eIDAS niveau simple :</strong> cette signature électronique a la valeur juridique d\'une signature manuscrite pour cette démarche administrative (Règlement UE n°910/2014, art. 25.1). Votre nom + horodatage + adresse IP + hash d\'intégrité SHA-256 sont enregistrés.';
    html += '</div>';

    html += '<label for="fullname">Nom complet (tel que sur votre pièce d\'identité)</label>';
    html += '<input type="text" id="fullname" required aria-required="true" aria-describedby="fullname-hint" placeholder="Prénom et nom" value="' + escapeHtml(state.fullName) + '" autocomplete="name">';
    html += '<div class="field-hint" id="fullname-hint">Votre signature électronique. Sera apposée sur le PDF transmis à la mairie.</div>';

    html += '<div class="consent-box">';
    html += '<strong>En signant, j\'atteste :</strong><br>';
    html += '• Avoir pris connaissance des informations ci-dessus et les certifier exactes.<br>';
    html += '• Comprendre que cette signature électronique a une valeur juridique (eIDAS).<br>';
    html += '• Accepter que mon nom, mon adresse IP et l\'horodatage soient enregistrés pour preuve.<br>';
    html += '• Accepter que ces données soient transmises à la <strong>mairie de ' + escapeHtml(d.commune.name) + '</strong> pour traitement de ma demande (RGPD).';
    html += '</div>';

    html += '<label class="consent-check"><input type="checkbox" id="consent-cb" required aria-required="true"' + (state.consent ? ' checked' : '') + '>';
    html += '<span>Je certifie avoir lu et j\'accepte de signer électroniquement cette démarche.</span></label>';

    html += '<div class="actions">';
    html += '<button class="btn-primary large" id="sign-btn"' + (state.submitting ? ' disabled' : '') + ' aria-label="Signer électroniquement et transmettre la démarche à la mairie">';
    html += (state.submitting ? '⏳ Signature en cours…' : '✍️ Signer et transmettre à la mairie');
    html += '</button>';
    html += '</div>';

    html += '</div>';

    c.innerHTML = html;

    // Bindings
    var fn = document.getElementById('fullname');
    if (fn) fn.addEventListener('input', function (e) { state.fullName = e.target.value; });
    var cb = document.getElementById('consent-cb');
    if (cb) cb.addEventListener('change', function (e) { state.consent = e.target.checked; });
    var btn = document.getElementById('sign-btn');
    if (btn) btn.addEventListener('click', submit);
  }

  load();
})();
</script>
</body>
</html>
